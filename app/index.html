async function classifyMany(texts, signal) {

      var byNo = {};

      all.length ? "조건에 맞는 안건이 없습니다. 필터를 풀어 보세요." : (S.dbTried && S.db && !S.sharedLoaded ? "공유 목록을 불러오는 중입니다." : "아직 저장된 안건이 없습니다. '분류하기'에서 문장을 분류해 저장하면 여기에 모입니다.")));
  } else {
    body = h("div", { class: "items" }, list.map(rowFor));
  }
  v.textContent = "";
  if (S.db && !S.sharedLoaded && S.sharedErr) v.append(h("div", { class: "notice info", style: "margin-bottom:12px" }, "공유 목록을 아직 불러오지 못했습니다. 화면에 보이는 내용이 최신이 아닐 수 있습니다."));
  v.append(summary, filters, body, h("p", { class: "hint mt", text: list.length + "건 표시 / 전체 " + all.length + "건" }));
}
function rowFor(it) {
  var d = it.at ? new Date(it.at).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) : "";
  var del = { armed: false };
  var delBtn = h("button", { class: "btn sm danger", onclick: function () {
    if (!del.armed) { del.armed = true; delBtn.textContent = "정말 삭제"; setTimeout(function () { del.armed = false; delBtn.textContent = "삭제"; }, 3000); }
    else removeItem(it);
  } }, "삭제");
  var cat = sel(null, CAT_KEYS, it.cat, function (e) { updateItem(it, { cat: e.target.value, edited: true }); });
  var urg = sel(null, URG_KEYS, it.urg, function (e) { updateItem(it, { urg: e.target.value, edited: true }); });
  var stt = sel(null, STAT_KEYS, it.stat, function (e) { var s = e.target.value; updateItem(it, { stat: s, check: s === "추가확인" ? true : it.check && s === "추가확인" }); });
  cat.setAttribute("aria-label", "칸"); urg.setAttribute("aria-label", "긴급도"); stt.setAttribute("aria-label", "처리상태");
  return h("div", { class: "item u-" + it.urg + (it.stat === "완료" ? " done" : "") },
    h("p", { class: "txt", text: it.text }),
    h("div", { class: "meta" },
      h("span", { class: "chip urg-" + it.urg, text: "긴급 " + it.urg }),
      h("span", { class: "chip stat stat-" + it.stat, text: (SYM[it.stat] || "") + " " + it.stat }),
      h("span", { class: "chip", text: it.cat }),
      it.check && it.stat !== "완료" ? h("span", { class: "chip stat stat-추가확인", title: it.reason || "", text: "확인 필요" }) : null,
      it.src === "sample" ? h("span", { class: "chip", text: "연습 데이터" }) : null,
      it.loc ? h("span", { class: "chip", text: "이 브라우저에만 저장" }) : null,
      it.edited ? h("span", { class: "chip", text: "사람이 수정" }) : null,
      h("span", { class: "mono", text: d })),
    h("div", { class: "edit" }, cat, urg, stt, delBtn));
}

/* ===================== 화면: 분류 기준 ===================== */
function renderRules() {
  var v = $("#view-rules"); v.textContent = "";
  function table(head, rows) {
    return h("div", { class: "tbl-wrap" }, h("table", null,
      h("thead", null, h("tr", null, head.map(function (x) { return h("th", { text: x }); }))),
      h("tbody", null, rows.map(function (r) { return h("tr", null, r.map(function (c, i) { return h("td", { class: i === 0 ? "k" : "", text: c }); })); }))));
  }
  v.append(h("div", { class: "panel" },
    h("h2", { text: "분류 기준" }),
    h("p", { class: "hint", text: "AI는 이 기준대로 분류합니다. 기준은 팀장님이 정하며, 이 화면에서는 바꿀 수 없습니다." }),
    h("h3", { text: "칸 (7개)" }),
    table(["칸", "무엇을 담는가"], CATS.map(function (c) { return [c.k, c.d]; })),
    h("h3", { text: "칸이 두 곳에 걸칠 때" }),
    h("ol", { class: "order" },
      h("li", { text: "실제 요청의 핵심 행동을 기준으로 정합니다." }),
      h("li", { text: "구분이 어려우면 위 표에서 앞에 있는 칸을 우선합니다." }),
      h("li", { text: "지표물질이 언급된 문장은 제형·안정(지표물질)로 분류합니다." })),
    h("h3", { text: "긴급도 (3단계)" }),
    table(["긴급도", "기준"], URGS.map(function (c) { return [c.k, c.d]; })),
    h("h3", { text: "처리상태" }),
    table(["처리상태", "기준"], STATS.map(function (c) { return [c.sym + " " + c.k, c.d]; })),
    h("p", { class: "hint mt", text: "처리상태는 문장에 나타난 진행 상황만으로 판단합니다. 분명하지 않으면 완료로 처리하지 않고 추가확인으로 표시합니다." })));
}

/* ===================== 화면: 정확도 점검 (팀장용) ===================== */
function renderEval() {
  var v = $("#view-eval"); v.textContent = "";
  var go = h("button", { class: "btn primary", id: "evgo", onclick: runEval }, "30문장 점검 실행");
  var stop = h("button", { class: "btn", id: "evstop", hidden: true, onclick: function () { if (S.ctl) S.ctl.abort(); } }, "중지");
  var panel = h("div", { class: "panel" },
    h("h2", { text: "정확도 점검 (팀장용)" }),
    h("p", { class: "hint", text: "팀장님이 직접 정답을 붙인 " + GOLD.length + "문장을 AI가 분류한 결과와 비교합니다. 이 문장들은 AI 예시에 들어 있지 않습니다. 공개 기준은 칸 80% 이상, 긴급도 70% 이상입니다." }),
    h("div", { class: "row" }, go, stop, h("span", { class: "hint", text: "분류 속도는 '분류하기' 화면의 설정을 따릅니다. (현재: " + (S.tier === "quick" ? "빠름" : "정확") + ")" })),
    h("div", { id: "evstatus", class: "hint mt", "aria-live": "polite" }),
    h("div", { id: "evout" }));
  v.append(panel);
  if (S.evalRes) drawEval(S.evalRes);
}
async function runEval() {
  if (S.busy) return;
  S.busy = true; S.ctl = new AbortController();
  $("#evgo").disabled = true; $("#evstop").hidden = false;
  var st = $("#evstatus"); st.textContent = "점검 중입니다. 30문장을 한 번에 보내므로 최대 1~2분 걸릴 수 있습니다.";
  try {
    var res = await classifyMany(GOLD.map(function (g) { return g.text; }), S.ctl.signal);
    if (!res.rows) { st.textContent = res.error; }
    else {
      S.evalRes = { rows: res.rows, mode: res.mode, tier: S.tier, at: Date.now() };
      st.textContent = res.mode === "rule" ? "AI를 쓸 수 없어 간이 분류 결과로 점검했습니다." : "";
      drawEval(S.evalRes);
    }
  } catch (e) {
    st.textContent = (e && e.code === "cancelled") ? "중지했습니다." : errCopy(e && e.code);
  } finally {
    S.busy = false; S.ctl = null;
    var g = $("#evgo"); if (g) g.disabled = false; var s = $("#evstop"); if (s) s.hidden = true;
  }
}
function drawEval(r) {
  var out = $("#evout"); if (!out) return; out.textContent = "";
  var n = GOLD.length, ok = { cat: 0, urg: 0, stat: 0, all: 0 }, diffs = [];
  GOLD.forEach(function (g, i) {
    var a = r.rows[i], d = [];
    if (a.cat === g["칸"]) ok.cat++; else d.push(["칸", g["칸"], a.cat]);
    if (a.urg === g["긴급도"]) ok.urg++; else d.push(["긴급도", g["긴급도"], a.urg]);
    if (a.stat === g["처리상태"]) ok.stat++; else d.push(["처리상태", g["처리상태"], a.stat]);
    if (!d.length) ok.all++; else diffs.push({ g: g, d: d });
  });
  function pct(x) { return Math.round(x / n * 100); }
  function meter(label, x, goal) {
    return h("div", { class: "meter" },
      h("div", { class: "top" }, h("span", { text: label }), h("span", { class: "num", text: x + " / " + n + " (" + pct(x) + "%)" })),
      h("div", { class: "bar" }, h("div", { class: "fill", style: "width:" + pct(x) + "%" }), goal ? h("div", { class: "goal", style: "left:" + goal + "%", title: "기준 " + goal + "%" }) : null));
  }
  var pass = pct(ok.cat) >= 80 && pct(ok.urg) >= 70;
  out.append(
    h("div", { class: "meters" }, meter("칸 (기준 80%)", ok.cat, 80), meter("긴급도 (기준 70%)", ok.urg, 70), meter("처리상태 (참고)", ok.stat, 0), meter("세 항목 모두 일치", ok.all, 0)),
    h("div", { class: "notice" + (pass ? " info" : "") }, h("b", { text: pass ? "공개 기준을 충족했습니다. " : "공개 기준에 못 미칩니다. " }),
      (r.mode === "rule" ? "간이 분류 기준 결과입니다. " : "") + "칸 " + pct(ok.cat) + "%, 긴급도 " + pct(ok.urg) + "%. 점검 속도: " + (r.tier === "quick" ? "빠름" : "정확")),
    h("h3", { text: "AI와 정답이 다른 문장 " + diffs.length + "개" }),
    h("div", null, diffs.length ? diffs.map(function (x) {
      return h("div", { class: "diff" }, h("div", { text: x.g.text }),
        x.d.map(function (d) { return h("div", { class: "pair" }, h("span", { class: "mono", text: d[0] }), h("span", { class: "me", text: "내 정답 " + d[1] }), h("span", { class: "ai", text: "AI " + d[2] })); }));
    }) : h("p", { class: "hint", text: "모두 일치했습니다." })));
}

/* ===================== 화면 전환 ===================== */
var TABS = ["classify", "list", "rules", "eval"];
function showTab() {
  var t = (location.hash || "").replace("#", "");
  if (TABS.indexOf(t) < 0) t = "classify";
  if (t === "eval" && !S.isOwner) t = "classify";
  TABS.forEach(function (k) {
    var sec = $("#view-" + k); if (sec) sec.hidden = (k !== t);
    var a = $('#tabs a[data-tab="' + k + '"]'); if (a) { if (k === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  });
  if (t === "list") renderList();
  if (t === "eval") renderEval();
}
window.addEventListener("hashchange", showTab);

/* ===================== 시작: 화면은 먼저 그리고, 기능은 뒤에서 켠다 ===================== */
renderPills(); renderClassify(); renderRules(); showTab();

(async function boot() {
  var c = S.claude;
  if (!c || !c.use) { S.dbTried = true; S.aiMode = "rule"; renderPills(); renderList(); return; }
  try { S.user = await c.use("user"); } catch (e) { S.user = null; }
  if (S.user) {
    try { S.isOwner = await S.user.isOwner() || await S.user.canEdit(); } catch (e) {}
    try { S.uid = await S.user.id(); } catch (e) {}
  }
  $("#tab-eval").hidden = !S.isOwner;
  try { S.sample = await c.use("sample"); } catch (e) { S.sample = null; }
  if (!S.sample) S.aiMode = "rule";
  renderPills();
  try { S.db = await c.use("db"); } catch (e) { S.db = null; }
  S.dbTried = true;
  renderPills();
  if (S.db) {
    var timer = setTimeout(function () { if (!S.sharedLoaded) { S.sharedErr = true; renderPills(); renderList(); } }, 10000);
    try {
      S.db.collection("items").onSnapshot(function (snap) {
        S.shared = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id, loc: false }); });
        if (!snap.metadata.fromCache) { S.sharedLoaded = true; S.sharedErr = false; clearTimeout(timer); }
        renderPills(); renderList();
      }, function () { S.sharedErr = true; clearTimeout(timer); renderPills(); renderList(); });
    } catch (e) { S.sharedErr = true; renderPills(); }
  }
  showTab();
})();
</script>
