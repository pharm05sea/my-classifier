<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPD 안건 분류기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: 한 장짜리 업무 도구. 상단 제목줄 + 탭, 아래에 작업 영역. 목록은 긴급도 우선 정렬. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E7EBF3;
  --ink: #101828;
  --muted: #475467;
  --line: #D0D7E4;
  --accent: #1D3F82;
  --accent-ink: #FFFFFF;
  --accent-soft: #DEE7F7;
  --hi: #B42318;
  --hi-soft: #FDE8E5;
  --mid: #8A4B00;
  --mid-soft: #FDEFC7;
  --lo: #3A4A63;
  --lo-soft: #E6EAF1;
  --ok: #17663A;
  --ok-soft: #E0F2E7;
  --ck0: #3D6FB6; --ck1: #9B4F96; --ck2: #B8527D; --ck3: #2B8A7E; --ck4: #6B8E23; --ck5: #B5651D; --ck6: #5F6B7A;
  --font-body: "Nanum Gothic", "NanumGothic", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141F; --surface: #151D2B; --surface-2: #1E2838; --ink: #EEF2F8; --muted: #AAB6C8; --line: #2E3A4E;
    --accent: #6EA8FE; --accent-ink: #07142B; --accent-soft: #1A2B4A;
    --hi: #FF9E94; --hi-soft: #40211F; --mid: #F5C26B; --mid-soft: #3B2E12; --lo: #9DB6D3; --lo-soft: #1C2A3B; --ok: #7FD6A0; --ok-soft: #16301F;
    --ck0: #8CB4F0; --ck1: #D79AD3; --ck2: #EE9DBE; --ck3: #6FD0C1; --ck4: #B6D36A; --ck5: #E2A468; --ck6: #A9B5C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141F; --surface: #151D2B; --surface-2: #1E2838; --ink: #EEF2F8; --muted: #AAB6C8; --line: #2E3A4E;
  --accent: #6EA8FE; --accent-ink: #07142B; --accent-soft: #1A2B4A;
  --hi: #FF9E94; --hi-soft: #40211F; --mid: #F5C26B; --mid-soft: #3B2E12; --lo: #9DB6D3; --lo-soft: #1C2A3B; --ok: #7FD6A0; --ok-soft: #16301F;
  --ck0: #8CB4F0; --ck1: #D79AD3; --ck2: #EE9DBE; --ck3: #6FD0C1; --ck4: #B6D36A; --ck5: #E2A468; --ck6: #A9B5C4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 980px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; padding-bottom: 14px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.pill b { color: var(--ink); font-weight: 500; }
.pill.warn { border-color: var(--mid); color: var(--mid); background: var(--mid-soft); }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-top: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.panel + .panel { margin-top: 16px; }
h2 { font-size: 17px; margin: 0 0 10px; font-weight: 600; }
h3 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; }
p { margin: 0 0 10px; }
.hint { color: var(--muted); font-size: 13px; }
label.lbl { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
textarea {
  width: 100%; min-height: 110px; resize: vertical; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
}
select, input[type="search"] {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; max-width: 100%;
}
.btn {
  font: inherit; font-weight: 500; font-size: 14px; padding: 8px 16px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--hi); border-color: var(--hi); }
.btn.sm { padding: 3px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.mt { margin-top: 12px; }
/* 분류 결과 */
.result { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 16px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fields select { width: 100%; }
.why { margin-top: 12px; padding: 10px 12px; background: var(--surface-2); border-radius: 4px; font-size: 14px; }
.notice { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--mid); background: var(--mid-soft); color: var(--mid); border-radius: 4px; font-size: 14px; }
.notice.info { border-color: var(--lo); background: var(--lo-soft); color: var(--lo); }
/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.chip.urg-높음 { background: var(--hi-soft); color: var(--hi); border-color: var(--hi); font-weight: 600; }
.chip.urg-보통 { background: var(--mid-soft); color: var(--mid); border-color: transparent; }
.chip.urg-낮음 { background: var(--lo-soft); color: var(--lo); border-color: transparent; }
.chip.stat { background: transparent; }
.chip.stat-추가확인 { border-style: dashed; color: var(--mid); border-color: var(--mid); }
.chip.stat-완료 { color: var(--ok); }
/* 요약 */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.stat-box .n { font-family: var(--font-mono); font-size: 24px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-box .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat-box.alert .n { color: var(--hi); }
.stat-box .n { display: inline-block; padding-bottom: 3px; border-bottom: 3px solid var(--accent); }
.stat-box.alert .n { border-bottom-color: var(--hi); }
button.stat-box:hover .n { border-bottom-width: 5px; padding-bottom: 1px; }
button.stat-box { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
button.stat-box:hover { border-color: var(--accent); }
button.stat-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stat-box.active { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.tile-note { margin: -4px 0 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.filters label.chk { display: inline-flex; gap: 5px; align-items: center; font-size: 13.5px; }
.items { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.item { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.item:first-child { border-top: 0; }
.item.u-높음:not(.done) { box-shadow: inset 3px 0 0 var(--hi); }
.item.done .txt { color: var(--muted); }
.item .txt { margin: 0; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.item-top { display: flex; gap: 12px; align-items: flex-start; }
.item-main { flex: 1; min-width: 0; display: grid; gap: 8px; }
.item-side { flex: none; }
.item.editing { background: var(--surface-2); }
.editor { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 12px; }
.ed-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ed-field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.ed-field select { width: 100%; font-size: 14px; padding: 6px 8px; }
.ed-field.wide input { width: 100%; font: inherit; font-size: 14px; padding: 7px 9px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.ed-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.chip.owner { background: var(--accent-soft); border-color: transparent; }
.chip.owner.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.adv { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); margin-bottom: 12px; }
.adv > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
.adv > summary::-webkit-details-marker { display: none; }
.adv > summary::before { content: "▸"; color: var(--muted); }
.adv[open] > summary::before { content: "▾"; }
.adv > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.adv-n { font-size: 12.5px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 1px 9px; border-radius: 999px; }
.adv > .filters { padding: 0 14px 12px; margin: 0; }
.ed-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ed-actions .grow { flex: 1; }
@media (max-width: 560px) { .ed-grid { grid-template-columns: 1fr; } }
.mono { font-family: var(--font-mono); font-size: 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
/* 기준 표 */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.k { white-space: nowrap; font-weight: 500; }
ol.order { margin: 6px 0 0; padding-left: 20px; }
/* 점검 */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 14px 0; }
.meter .top { display: flex; justify-content: space-between; font-size: 13.5px; }
.meter .bar { position: relative; height: 10px; background: var(--surface-2); border-radius: 2px; margin-top: 6px; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.meter .goal { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.meter .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.diff { padding: 10px 0; border-top: 1px solid var(--line); }
.diff:first-child { border-top: 0; }
.diff .pair { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 4px; }
.diff .pair span.me { color: var(--ok); }
.diff .pair span.ai { color: var(--hi); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 4px; font-size: 14px; max-width: calc(100vw - 32px); z-index: 20; }
@media (max-width: 640px) {
  .fields { grid-template-columns: 1fr; }
  h1 { font-size: 21px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* ===== A 디자인: 차분한 카드형 + 표 보기 ===== */
body { font-size: 16px; line-height: 1.7; word-break: keep-all; overflow-wrap: break-word; }
h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 16.5px; font-weight: 800; }
.sub { font-size: 15px; }
nav.tabs a { font-size: 16px; font-weight: 700; padding: 11px 16px; }
.panel { border-radius: 12px; }
.hint { font-size: 14.5px; }
.btn { font-weight: 700; border-radius: 8px; min-height: 40px; }
.btn.sm { min-height: 36px; font-size: 14.5px; padding: 3px 14px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.ghost:disabled { color: var(--muted); background: transparent; }
.btn.edit::before { content: "✎ "; }
.summary { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
.stat-box { position: relative; overflow: hidden; border-radius: 12px; border-width: 1.5px; padding: 18px 18px 14px; }
.stat-box::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--c, var(--accent)); }
.stat-box.k-decide { --c: var(--lo); } .stat-box.k-urgent { --c: var(--hi); } .stat-box.k-check { --c: var(--mid); }
.stat-box .n { font-family: var(--font-body); font-size: 36px; font-weight: 800; line-height: 1.15; border-bottom: 4px solid var(--c, var(--accent)); padding-bottom: 2px; }
button.stat-box:hover .n { border-bottom-width: 4px; padding-bottom: 2px; }
.stat-box.alert .n { color: var(--hi); border-bottom-color: var(--hi); }
.stat-box .l { font-size: 14.5px; font-weight: 700; margin-top: 8px; }
.stat-box .go { position: absolute; right: 14px; bottom: 12px; font-size: 22px; color: var(--muted); }
.stat-box.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); background: var(--surface); }
.a-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.adv-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 800; font-size: 15.5px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--accent-soft); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.adv-btn em { font-style: normal; font-size: 13px; background: var(--accent); color: var(--accent-ink); padding: 0 8px; border-radius: 999px; }
.a-bar input[type="search"] { flex: 1; min-width: 170px; font-size: 15.5px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); }
.a-bar .cnt { margin-left: auto; font-size: 14.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg-btn { font: inherit; font-weight: 700; font-size: 14.5px; padding: 6px 14px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.seg-btn.on { background: var(--accent); color: var(--accent-ink); }
.seg-btn:focus-visible, .adv-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.adv-panel { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.adv-panel[hidden] { display: none; }
.adv-panel select { font-size: 15px; }
.adv-panel label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; }
.items { border: 0; background: transparent; gap: 12px; }
.items .empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; }
.item { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 20px; }
.item:first-child { border-top: 1.5px solid var(--line); }
.item::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 5px 5px 0; background: var(--bar, var(--line)); }
.item.u-높음 { --bar: var(--hi); } .item.u-보통 { --bar: var(--mid); } .item.u-낮음 { --bar: var(--lo); }
.item.u-높음:not(.done) { box-shadow: none; }
.item.done { opacity: .75; }
.item.done .txt { color: var(--muted); }
.item .txt { font-size: 17px; font-weight: 700; line-height: 1.55; }
.item .meta { gap: 8px; font-size: 14px; }
.item .meta .mono { margin-left: auto; font-size: 13px; }
.item.editing { background: var(--surface-2); }
.chip { border-radius: 6px; font-size: 14px; padding: 1px 10px; line-height: 1.65; }
.chip.urg-높음 { border-color: transparent; font-weight: 800; }
.chip.stat { border: 1.5px solid var(--line); background: var(--surface); }
.chip.stat-추가확인 { border-style: dashed; border-color: var(--mid); }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.who b { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; display: inline-grid; place-items: center; font-weight: 800; }
.who.none { color: var(--muted); border: 1.5px dashed var(--line); border-radius: 6px; padding: 0 9px; }
.c-wrap { overflow-x: auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; }
.c-tab { width: 100%; border-collapse: collapse; min-width: 780px; }
.c-tab th { text-align: left; font-size: 14px; color: var(--muted); font-weight: 800; padding: 12px 14px; background: var(--surface-2); border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.c-tab td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 15.5px; }
.c-tab tbody tr:last-child td { border-bottom: 0; }
.c-tab tbody tr:not(.edit-row):hover { background: var(--accent-soft); }
.c-tab td.t { font-weight: 700; min-width: 280px; overflow-wrap: anywhere; }
.c-tab .tflags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-weight: 400; }
.c-tab tr.done td { color: var(--muted); }
.c-tab tr.editing td { background: var(--surface-2); }
.c-tab tr.edit-row td { background: var(--surface-2); padding-top: 4px; }
.c-urg { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; white-space: nowrap; }
.c-urg i { width: 12px; height: 12px; border-radius: 50%; background: var(--d); display: inline-block; }
.c-urg.h { --d: var(--hi); color: var(--hi); } .c-urg.m { --d: var(--mid); color: var(--mid); } .c-urg.l { --d: var(--lo); color: var(--lo); }
.btn, .who, .chip, .seg-btn, .adv-btn { white-space: nowrap; }
.c-tab td:last-child { width: 1%; }
@media (max-width: 560px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat-box { padding: 14px 12px 10px; }
  .stat-box .n { font-size: 30px; }
  .stat-box .l { font-size: 13.5px; }
  .stat-box .go { display: none; }
  .a-bar { gap: 8px; padding: 8px 10px; }
  .a-bar .cnt { margin-left: 0; }
  .summary .stat-box:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
/* 5번째 타일(완료) */
.summary { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stat-box.k-done { --c: var(--ok); }
/* 구분 · 담당자 · 처리상태를 같은 크기로 */
.item .meta .eq { width: 11.5em; justify-content: center; text-align: center; }
.c-tab td .eq { display: flex; width: 100%; justify-content: center; text-align: center; }
.c-tab { min-width: 890px; }
.c-tab th:nth-child(3), .c-tab th:nth-child(4), .c-tab th:nth-child(5) { width: 158px; text-align: center; padding-left: 8px; padding-right: 8px; }

<script>
"use strict";
/* ===================== 분류 기준: criteria.json · status.json 에서 읽는다 ===================== */
var CRITERIA = null, KEYWORDS = null;
var CATS = [], URGS = [], STATS = [], CAT_KEYS = [], URG_KEYS = [], STAT_KEYS = [], SYM = {}, URG_RANK = {};
var STAGE_SYMS = ["○", "◐", "◆", "✓"];
// 추가확인은 처리 단계가 아니라 '사람이 확인할 것' 표시라 status.json 의 4단계 뒤에 붙인다
var EXTRA_STAT = { k: "추가확인", d: "문장만으로 진행 상황을 알 수 없을 때. 임의로 완료 처리하지 않고 사람이 확인", sym: "?" };
function setupCriteria(criteria, status, keywords) {
  CRITERIA = criteria; KEYWORDS = keywords;
  CATS = criteria["칸"].map(function (c) { return { k: c["이름"], d: c["정의"] }; });
  URGS = criteria["긴급도"].map(function (u) { return { k: u["이름"], d: u["기준"] }; });
  STATS = status["처리상태"].map(function (x, i) { return { k: x["이름"], d: x["기준"], sym: STAGE_SYMS[i] || "•" }; }).concat([EXTRA_STAT]);
  CAT_KEYS = CATS.map(function (c) { return c.k; });
  URG_KEYS = URGS.map(function (c) { return c.k; });
  STAT_KEYS = STATS.map(function (c) { return c.k; });
  SYM = {}; STATS.forEach(function (x) { SYM[x.k] = x.sym; });
  URG_RANK = {}; URG_KEYS.forEach(function (k, i) { URG_RANK[k] = i; });
}

/* ===================== 작은 도구 ===================== */
function $(s, r) { return (r || document).querySelector(s); }
function h(tag, props) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(e, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (x) { append(e, x); }); return; }
  e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function sel(id, keys, value, onchange, cls) {
  var s = h("select", { id: id, class: cls || "" });
  keys.forEach(function (k) { var o = h("option", { value: k, text: k }); if (k === value) o.selected = true; s.append(o); });
  if (onchange) s.addEventListener("change", onchange);
  return s;
}
var toastTimer = null;
function toast(msg) {
  var t = $("#toast"); t.textContent = msg; t.hidden = false;
